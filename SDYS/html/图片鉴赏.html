        .content ol{
            margin-top: 250px;
            grid-template-columns: repeat(3, 35px);
        }
        .content ol li{
            width: 13px;

        }
        .box{
            animation:

                    run 2s linear infinite;
        }
        /* 人在盒子里跑 */
        @keyframes move{
            from{
                background-position: -1680px 0;
            }
            /* 若从0 开始的话这个from可以省去 */
            /* from{
                background-position: 0 0;
            } */
            to{
                background-position: 0 0;
            }
        }
        @keyframes run{
            from{
                transform: translateX(500px);
            }
            /* 若从0 开始的话这个from可以省去 */
            /* from{
                transform: translateX(0);
            } */
        }
    }
