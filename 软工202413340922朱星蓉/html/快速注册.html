<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>快速注册</title>
    <script src="../js/注册.js"></script>
    <link rel="stylesheet" href="../css/布局.css">
    <style>
        @media screen and (min-width: 1080px) {
            .ku {
                background-color: burlywood;
                height: 50px;
                margin: 0;
            }

            body {
                margin: 0;
            }
            .g{
                background-color: burlywood;
                height: 50px;
                margin: 0px;
                color: white;
                font-family: 微软雅黑;
                font-size: 15px;
                line-height: 50px;
                text-align: center;
            }
        }

        @media screen and (max-width: 1080px) {
            .ku {
                background-color: red;
                height: 30px;
                margin: 0px;
                width: 100%;
            }

            body {
                margin: 0px;
            }

            .a {
                color: white;
                font-size: 20px;
                font-family: 微软雅黑;
                float: left;
                margin-left: 10px;
            }

            .b {
                font-family: 宋体;
                font-size: 13px;
                text-align: center;
                line-height: 30px;
                float: right;
                color: white;
                width: 60px;
                height: 30px;
            }

            .g {
                background-color: red;
                height: 50px;
                margin: 0px;
                color: white;
                font-family: 微软雅黑;
                font-size: 15px;
                line-height: 50px;
                text-align: center;
            }
            .overall{
                width: 98%;
                height: 300px;
                padding: 0;
            }
            .content ul>li img{
                width: 98%;
                height: 300px;
            }
            .content ol{
                margin-top: 250px;
                grid-template-columns: repeat(3, 35px);
            }
            .content ol li{
                width: 13px;
                height: 5px;
                border: 3px solid #af9d9d;
            }
            .box {
                width: 140px;
                height: 100px;
                /* border:1px solid pink; */
                position: fixed;
                bottom: 0;
                background-image: url(../pic/u=2083379215,3583338455&fm=253&fmt=auto&app=120&f=JPEG_副本_副本.png);
                animation: move 1s steps(12) infinite,
                run 2s linear infinite;
            }

            @keyframes move {
                from {
                    background-position: -1680px 0;
                }
                /* 若从0 开始的话这个from可以省去 */
                /* from{
                    background-position: 0 0;
                } */
                to {
                    background-position: 0 0;
                }
            }
            @keyframes run {
                from {
                    transform: translateX(500px);
                }
                /* 若从0 开始的话这个from可以省去 */
                /* from{
                    transform: translateX(0);
                } */
            }
            .login{
                width: 90%;
                height: 500px;
                margin: 30px 5%;
            }
            .login input{
                width: 90%;
                margin: 10px 5%;
            }
            .login button{
                width: 90%;
                margin: 10px 5%;
            }
            .login p{
                margin-left: 60px;
                font-size: 15px;
            }
            .login p a{
                color: #565aff;
            }
        }
        a:hover, a:active{
            color: #565aff;
            text-decoration: underline;
        }
        a:link, a:visited{
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="box"></div>

    <form action="">
